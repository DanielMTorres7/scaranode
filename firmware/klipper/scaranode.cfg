# =====================================================================================
#  ScaraNode rev. v18 — configuração Klipper de REFERÊNCIA
#  Projetista: Daniel M. Torres · 27/09/2026
#
#  Montada a partir da placa (hardware/ScaraNode.kicad_pcb, pinagem conferida pino a pino),
#  não copiada do printer.cfg da máquina. A cinemática SCARA (scara.py / kin_scara.c) e os
#  valores mecânicos (rotation_distance, limites, velocidades) são da máquina, não da placa:
#  estão marcados com  # AJUSTAR.
#
#  Um RP2040-Zero por nó. Cada nó vira um [mcu <nome>] e os pinos levam o prefixo "<nome>:".
#  Aqui: j2 = nó com TMC2209 (NEMA 17) e j1 = nó com DM556 externo (NEMA 23).
#  Nós iguais (j3, z) repetem o bloco trocando o nome e o serial.
#  Desde a v18 o TMC2209 e o DM556 têm STEP/DIR/enable próprios: um nó pode mover dois motores
#  ao mesmo tempo, um em cada driver. Nesse caso o FIM1 (gpio27) fica com o eixo do TMC e o
#  FIM2 (gpio15) com o do DM556 (cada chave no mesmo MCU do seu motor).
#
#  Pinagem da placa (RP2040-Zero):
#    GP0  EN do TMC2209 (ativo baixo, pull-up 10k R6)      GP6  STEP do DM556 (via 74ACT245)
#    GP1  monitor de 24 V (divisor 47k/5k6, ~2,5 V)        GP7  DIR  do DM556 (via 74ACT245)
#    GP2  PDN_UART do TMC2209 (pino 4) via jumper JU       GP8  ENA do DM556 (alto = habilitado)
#    GP4  STEP do TMC2209                                  GP5  DIR  do TMC2209
#    GP15 fim de curso 2 (J2, pull-up 10k R14)             GP27 fim de curso 1 (J1, pull-up 10k R13)
#    GP29 NTC1 no J3 (ADC3, pull-up 100k R3)               GP26 NTC2 no J8 (ADC0, pull-up 100k R15)
#
#  ⚠ PARA NÃO QUEIMAR O DRIVER (um TMC2209 pegou fogo a 1,7 A em 27/09/2026):
#    1. run_current do TMC2209 no MÁXIMO 1,0–1,2 A. O StepStick não dissipa mais que isso.
#       Motor que precisa de mais corrente vai no DM556.
#    2. Use a UART (JU fechado + seção [tmc2209]). Só com ela o Klipper lê os avisos de
#       temperatura do TMC e para a máquina antes de queimar; em standalone ninguém vigia o driver.
#    3. NUNCA ligue/desligue o cabo do motor com a 24 V ligada: o pico mata o driver na hora.
#    4. Ponteira (terminal tubular) nos fios do borne do motor e da 24 V, bem apertados.
#    5. Um fusível de 2 A SÓ para esta placa na caixa de fusíveis (docs/06-circuitos.md).
# =====================================================================================

# -------------------------------------------------------------------------------------
#  Nó J2 — NEMA 17 + TMC2209 no soquete U4
# -------------------------------------------------------------------------------------
[mcu j2]
serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXXXXXX-if00   # AJUSTAR: ls /dev/serial/by-id/

[stepper_j2]                          # o nome segue a sua cinemática SCARA  # AJUSTAR
step_pin: j2:gpio4
dir_pin: j2:gpio5                     # motor girando ao contrário: !j2:gpio5
enable_pin: !j2:gpio0                 # EN do TMC2209 é ativo em nível baixo
microsteps: 16                        # com UART vem daqui; em standalone o TMC fica fixo em 1/16
rotation_distance: 360                # AJUSTAR: graus por volta da junta
gear_ratio: 6:1, 4:1                  # AJUSTAR: planetária 6:1 + correia 4:1
endstop_pin: !j2:gpio27               # chave NA para GND. Chave NF: j2:gpio27 (sem !)
# position_endstop / position_min / position_max / homing_speed   # AJUSTAR

# Recomendado: UART (JU FECHADO). Com o JU aberto, comente esta seção: o driver fica em
# standalone (corrente pelo trimpot, micropasso fixo em 1/16) e o Klipper não vigia a temperatura dele.
[tmc2209 stepper_j2]
uart_pin: j2:gpio2                    # PDN_UART no pino 4 do soquete (v18; até a v17 era gpio5 no pino 5)
uart_address: 3                       # MS1 e MS2 fixos em 1 pelo R4/R5 (v18, sem jumper ZM)
run_current: 1.0                      # ⚠ MÁXIMO 1,2 (A RMS) no StepStick, com ventoinha no J7
sense_resistor: 0.110                 # RSENSE R110 do módulo usado
stealthchop_threshold: 0              # 0 = spreadCycle sempre

[temperature_sensor motor_j2]
sensor_type: Generic 3950             # NTC 100k B3950 no J3
sensor_pin: j2:gpio29
pullup_resistor: 100000               # R3 = 100k (o padrão do Klipper é 4k7)
min_temp: 0
max_temp: 70                          # acima disso o Klipper desliga tudo

[gcode_button vm_sense_j2]            # monitor de 24 V: alto = 24 V presente
pin: j2:gpio1
press_gcode:
  G4 P0
release_gcode:
  M112                                # perdeu o 24 V com a máquina ligada: parada de emergência

# -------------------------------------------------------------------------------------
#  Nó J1 — NEMA 23 + DM556 externo pelo J4 (soquete U4 vazio)
# -------------------------------------------------------------------------------------
[mcu j1]
serial: /dev/serial/by-id/usb-Klipper_rp2040_YYYYYYYYYYYYYYYY-if00   # AJUSTAR

[stepper_j1]                                                          # AJUSTAR nome
step_pin: !j1:gpio6                   # DM556 ânodo comum: o 74ACT245 afunda PUL- => pulso ativo baixo
dir_pin: j1:gpio7
enable_pin: j1:gpio8                  # GP8 alto = opto do ENA apagado = motor habilitado (SEM !)
step_pulse_duration: 0.000005         # DM556 pede >= 2,5 µs
microsteps: 16                        # AJUSTAR: igual às chaves SW5-SW8 do DM556
rotation_distance: 360                # AJUSTAR
gear_ratio: 6:1, 4:1                  # AJUSTAR
endstop_pin: !j1:gpio27               # AJUSTAR conforme NA/NF

[temperature_sensor motor_j1]
sensor_type: Generic 3950
sensor_pin: j1:gpio29
pullup_resistor: 100000
min_temp: 0
max_temp: 70

# Com dois motores na mesma placa (um no TMC2209, outro no DM556), o segundo NTC vai no J8:
#[temperature_sensor motor_2]
#sensor_type: Generic 3950
#sensor_pin: j1:gpio26                 # NTC2 no J8 (ADC0, pull-up 100k R15)
#pullup_resistor: 100000
#min_temp: 0
#max_temp: 70

[gcode_button vm_sense_j1]
pin: j1:gpio1
press_gcode:
  G4 P0
release_gcode:
  M112

# -------------------------------------------------------------------------------------
